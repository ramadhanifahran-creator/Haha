
name: Build Mantap Tracker APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip mantap-tracker-project.zip -d project

      - name: Build APK
        run: |
          gradle -p project/android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mantap-Tracker-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
